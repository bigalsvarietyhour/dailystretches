<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Daily Fix" />
  <meta name="theme-color" content="#F1ECDC" />
  <title>Daily Fix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Geist:wght@300..700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #F1ECDC; }
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; }
    button { font-family: inherit; }
    #err {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      background: #fee; color: #800; padding: 12px 16px;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      white-space: pre-wrap; max-height: 50vh; overflow: auto;
      border-bottom: 2px solid #c00; display: none;
    }
  </style>
</head>
<body>
  <div id="err"></div>
  <div id="root"></div>
  <script>
    window.addEventListener("error", function(e) {
      var el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = "Error: " + (e.message || e) + "\n" + (e.filename || "") + ":" + (e.lineno || "") + ":" + (e.colno || "") + (e.error && e.error.stack ? "\n" + e.error.stack : "");
    });
    window.addEventListener("unhandledrejection", function(e) {
      var el = document.getElementById("err");
      el.style.display = "block";
      el.textContent = "Unhandled rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason);
    });
  </script>
  <script type="text/babel" data-presets="react,env">
const { useState, useEffect, useRef, useCallback, Fragment } = React;

// Inline lucide-style icons (replaces lucide-react imports)
const Icon = ({ children, size = 24, strokeWidth = 2, style = {}, fill = "none", ...rest }) => (
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width={size}
    height={size}
    viewBox="0 0 24 24"
    fill={fill}
    stroke="currentColor"
    strokeWidth={strokeWidth}
    strokeLinecap="round"
    strokeLinejoin="round"
    style={style}
    {...rest}
  >
    {children}
  </svg>
);
const Pause = (p) => <Icon {...p}><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></Icon>;
const Play = (p) => <Icon {...p}><polygon points="6 3 20 12 6 21 6 3" /></Icon>;
const X = (p) => <Icon {...p}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></Icon>;
const Check = (p) => <Icon {...p}><path d="M20 6 9 17l-5-5" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Icon>;
const SkipForward = (p) => <Icon {...p}><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" x2="19" y1="5" y2="19" /></Icon>;
const Volume2 = (p) => <Icon {...p}><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.384 3.384A.705.705 0 0 0 11 19.298z" /><path d="M16 9a5 5 0 0 1 0 6" /><path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></Icon>;

// ---------- Theme ----------
const C = {
  bg: "#F1ECDC",
  card: "#FBF7E9",
  cardSoft: "#F7F2DF",
  text: "#1F1D17",
  textSoft: "#6E6855",
  textFaint: "#9C9580",
  border: "#D9D2BB",
  borderSoft: "#E5DEC7",
  green: "#3E6A3D",
  greenSoft: "#E5EDD3",
  skipped: "#C8C2AC",
  skippedFaint: "#A8A290",
};

// ---------- Routine ----------
// Three "problems," each with ordered exercises.
// kind: "timer" (counts down), "reps" (manual done), "lr" (timed L then R)
// optional: true means it can be hidden/shown via toggle
const routine = [
  {
    id: "strength",
    title: "Strength",
    exercises: [
      { id: "hanging-raises", name: "Hanging Ab Raises", kind: "reps", reps: 10, hint: "strict · curl pelvis up at the top" },
      { id: "bridges", name: "Weighted Glute Bridges", kind: "reps", reps: 20, hint: "drive through heels · squeeze hard" },
      { id: "face-pulls", name: "Face Pulls", kind: "reps", reps: 20, hint: "elbows lead · hands to ears" },
      { id: "chin-tucks", name: "Banded Chin Tucks", kind: "reps", reps: 20, hint: "head straight back · 2s hold each rep" },
    ],
  },
  {
    id: "stretch",
    title: "Stretch",
    exercises: [
      { id: "chest-opener", name: "Chest Opener", kind: "timer", duration: 60, hint: "foam roller · or doorway if no roller" },
      {
        id: "lunge-warmup",
        name: "Deep Lunge",
        kind: "lr",
        duration: 60,
        hint: "hips low · breathe into the front hip",
      },
      { id: "couch", name: "Couch Stretch", kind: "lr", duration: 60, hint: "tuck pelvis · feel the front leg" },
    ],
  },
];

// ---------- Helpers ----------
const formatTime = (s) => {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, "0")}`;
};

const slotsFor = (ex) => (ex.kind === "lr" ? 2 : 1);

const totalSeconds = (showOptional) => {
  let total = 0;
  routine.forEach((sec) => {
    sec.exercises.forEach((ex) => {
      if (ex.optional && !showOptional) return;
      if (ex.kind === "lr") total += ex.duration * 2;
      else if (ex.kind === "timer") total += ex.duration;
      else if (ex.kind === "reps") total += Math.max(15, ex.reps * 2);
    });
  });
  return total;
};

const setKey = (sIdx, eIdx, slotIdx) => `${sIdx}-${eIdx}-${slotIdx}`;

// ---------- App ----------
function App() {
  const [completed, setCompleted] = useState({});
  const [active, setActive] = useState(null); // { sectionIdx, exerciseIdx, slotIdx, mode, remaining, total, paused }
  const [actionMenu, setActionMenu] = useState(null);
  const [sessionStart, setSessionStart] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [showOptional, setShowOptional] = useState(false);
  const [soundOn, setSoundOn] = useState(true);
  const soundOnRef = useRef(true);
  soundOnRef.current = soundOn;
  const audioCtxRef = useRef(null);

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  const playBeep = useCallback((freq = 660, dur = 200, vol = 0.18) => {
    if (!soundOnRef.current) return;
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur / 1000);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + dur / 1000);
    } catch {}
  }, []);

  // Timer tick
  useEffect(() => {
    if (!active || active.paused || active.mode !== "timer") return;
    if (active.remaining <= 0) {
      playBeep(660, 250);
      setTimeout(() => playBeep(880, 350), 220);
      setActive({ ...active, mode: "complete" });
      return;
    }
    const t = setTimeout(() => {
      if (active.remaining <= 4 && active.remaining > 1) playBeep(330, 80, 0.12);
      setActive((a) => (a ? { ...a, remaining: a.remaining - 1 } : null));
    }, 1000);
    return () => clearTimeout(t);
  }, [active, playBeep]);

  const markDone = (a) => {
    if (!a) return;
    const k = setKey(a.sectionIdx, a.exerciseIdx, a.slotIdx);
    setCompleted((prev) => ({ ...prev, [k]: "done" }));
  };

  const markSkipped = (a) => {
    if (!a) return;
    const k = setKey(a.sectionIdx, a.exerciseIdx, a.slotIdx);
    setCompleted((prev) => ({ ...prev, [k]: "skipped" }));
  };

  const clearStatus = (a) => {
    if (!a) return;
    const k = setKey(a.sectionIdx, a.exerciseIdx, a.slotIdx);
    setCompleted((prev) => {
      const clone = { ...prev };
      delete clone[k];
      return clone;
    });
  };

  const startSlot = (sectionIdx, exerciseIdx, slotIdx) => {
    const ex = routine[sectionIdx].exercises[exerciseIdx];
    if (!sessionStart) setSessionStart(Date.now());
    playBeep(720, 130);

    const base = {
      sectionIdx,
      exerciseIdx,
      slotIdx,
      paused: false,
      name: ex.name,
      hint: ex.hint,
      side: ex.kind === "lr" ? (slotIdx === 0 ? "L" : "R") : null,
    };

    if (ex.kind === "reps") {
      setActive({ ...base, mode: "reps", reps: ex.reps });
    } else {
      setActive({ ...base, mode: "timer", remaining: ex.duration, total: ex.duration });
    }
  };

  const handleRepsDone = () => {
    setActive((a) => (a ? { ...a, mode: "complete" } : null));
    playBeep(720, 200);
  };
  const handleSkipTimer = () => {
    setActive((a) => (a ? { ...a, mode: "complete" } : null));
    playBeep(720, 200);
  };
  const handleCompleteDismiss = () => {
    markDone(active);
    setActive(null);
  };
  const togglePause = () => setActive((a) => (a ? { ...a, paused: !a.paused } : null));
  const closeTimer = () => setActive(null);

  const resetAll = () => {
    setCompleted({});
    setSessionStart(null);
  };

  const elapsed = sessionStart ? Math.floor((now - sessionStart) / 1000) : 0;
  const total = totalSeconds(showOptional);
  const hasProgress = Object.keys(completed).length > 0;

  return (
    <div
      className="min-h-screen w-full"
      style={{
        background: C.bg,
        color: C.text,
        fontFamily:
          "'Geist', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif",
        WebkitFontSmoothing: "antialiased",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Geist:wght@300..700&display=swap');
        .serif { font-family: 'Fraunces', Georgia, serif; }
        .tabular { font-variant-numeric: tabular-nums; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes softPulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
        @keyframes progressDeplete { from { width: 100%; } to { width: 0%; } }
      `}</style>

      {/* Slim top bar */}
      <div
        style={{
          background: C.green,
          color: "#FFFFFF",
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: "8px 16px",
          minHeight: "34px",
          position: "relative",
        }}
      >
        <div
          className="serif"
          style={{
            fontSize: "15px",
            fontWeight: 500,
            letterSpacing: "0.04em",
            lineHeight: 1,
            fontStyle: "italic",
          }}
        >
          daily fix
        </div>
        <SoundToggle soundOn={soundOn} onToggle={() => setSoundOn((s) => !s)} />
      </div>

      {/* Meta row */}
      <div className="px-4 pt-3 pb-2 flex items-center gap-3">
        <div
          style={{
            fontSize: "11px",
            letterSpacing: "0.22em",
            textTransform: "uppercase",
            color: C.textFaint,
            fontWeight: 600,
            flex: 1,
            minWidth: 0,
          }}
        >
          Session · ~{Math.round(total / 60)} min
        </div>
        <div
          className="tabular"
          style={{
            fontSize: "16px",
            fontWeight: 500,
            color: sessionStart ? C.green : C.textFaint,
            letterSpacing: "-0.01em",
          }}
        >
          {formatTime(elapsed)}
        </div>
        {hasProgress && (
          <button
            onClick={resetAll}
            className="rounded-full p-1.5"
            style={{
              color: C.textFaint,
              background: C.cardSoft,
              border: `1px solid ${C.borderSoft}`,
            }}
            aria-label="Reset"
          >
            <RotateCcw size={12} />
          </button>
        )}
      </div>

      {/* Sections */}
      <div className="px-4 pb-24 space-y-4">
        {routine.map((section, sIdx) => (
          <Section
            key={section.id}
            section={section}
            sectionIdx={sIdx}
            completed={completed}
            showOptional={showOptional}
            active={active}
            onStartSlot={startSlot}
            onLongPress={(sectionIdx, exerciseIdx, slotIdx) =>
              setActionMenu({ sectionIdx, exerciseIdx, slotIdx })
            }
          />
        ))}
      </div>

      {active && active.mode !== "complete" && (
        <TimerOverlay
          active={active}
          onPause={togglePause}
          onClose={closeTimer}
          onRepsDone={handleRepsDone}
          onSkipTimer={handleSkipTimer}
        />
      )}

      {actionMenu && !active && (
        <ActionMenu
          menu={actionMenu}
          completed={completed}
          onSkip={() => {
            markSkipped(actionMenu);
            setActionMenu(null);
          }}
          onReset={() => {
            clearStatus(actionMenu);
            setActionMenu(null);
          }}
          onClose={() => setActionMenu(null)}
        />
      )}

      {active && active.mode === "complete" && (
        <CompleteOverlay onTap={handleCompleteDismiss} />
      )}
    </div>
  );
}

// ---------- Section ----------
function Section({ section, sectionIdx, completed, showOptional, onStartSlot, onLongPress, active }) {
  const visible = section.exercises.filter((ex) => showOptional || !ex.optional);
  if (visible.length === 0) return null;

  return (
    <div>
      <div
        className="flex items-baseline gap-3 mb-2 px-1"
      >
        <div
          className="serif"
          style={{
            fontSize: "20px",
            fontWeight: 500,
            color: C.green,
            letterSpacing: "-0.01em",
            fontStyle: "italic",
          }}
        >
          {section.title}
        </div>
        <div style={{ flex: 1, height: "1px", background: C.borderSoft, marginBottom: "4px" }} />
      </div>

      <div
        className="rounded-2xl overflow-hidden"
        style={{ background: C.card, border: `1px solid ${C.border}` }}
      >
        {visible.map((ex, visIdx) => {
          const eIdx = section.exercises.indexOf(ex);
          return (
            <ExerciseRow
              key={ex.id}
              ex={ex}
              isLast={visIdx === visible.length - 1}
              sectionIdx={sectionIdx}
              exerciseIdx={eIdx}
              completed={completed}
              onStartSlot={onStartSlot}
              onLongPress={onLongPress}
              active={active}
            />
          );
        })}
      </div>
    </div>
  );
}

// ---------- Exercise Row ----------
function ExerciseRow({ ex, isLast, sectionIdx, exerciseIdx, completed, onStartSlot, onLongPress, active }) {
  const slots = slotsFor(ex);

  return (
    <div
      className="px-4 py-3"
      style={{ borderBottom: isLast ? "none" : `1px solid ${C.borderSoft}` }}
    >
      <div className="flex items-start justify-between gap-3">
        <div style={{ flex: 1, minWidth: 0 }}>
          <div
            style={{
              fontSize: "16px",
              fontWeight: 600,
              color: C.text,
              letterSpacing: "-0.005em",
              lineHeight: 1.25,
            }}
          >
            {ex.name}
            {ex.optional && (
              <span
                style={{
                  fontSize: "10px",
                  color: C.textFaint,
                  marginLeft: "8px",
                  letterSpacing: "0.1em",
                  textTransform: "uppercase",
                  fontWeight: 600,
                }}
              >
                opt
              </span>
            )}
          </div>
          {ex.hint && (
            <div style={{ fontSize: "12px", color: C.textFaint, marginTop: "2px", lineHeight: 1.3 }}>
              {ex.hint}
            </div>
          )}
        </div>

        {ex.kind === "lr" ? (
          <div className="flex gap-2 flex-shrink-0">
            {[0, 1].map((slotIdx) => (
              <div
                key={slotIdx}
                style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "4px" }}
              >
                <BigBadge
                  label={`${ex.duration}s`}
                  status={completed[setKey(sectionIdx, exerciseIdx, slotIdx)]}
                  active={
                    active &&
                    active.sectionIdx === sectionIdx &&
                    active.exerciseIdx === exerciseIdx &&
                    active.slotIdx === slotIdx
                  }
                  onClick={() => onStartSlot(sectionIdx, exerciseIdx, slotIdx)}
                  onLongPress={() => onLongPress(sectionIdx, exerciseIdx, slotIdx)}
                />
                <div
                  style={{
                    fontSize: "10px",
                    color: C.textFaint,
                    fontWeight: 600,
                    letterSpacing: "0.1em",
                    lineHeight: 1,
                  }}
                >
                  {slotIdx === 0 ? "L" : "R"}
                </div>
              </div>
            ))}
          </div>
        ) : (
          <BigBadge
            label={ex.kind === "timer" ? `${ex.duration}s` : `×${ex.reps}`}
            status={completed[setKey(sectionIdx, exerciseIdx, 0)]}
            active={
              active &&
              active.sectionIdx === sectionIdx &&
              active.exerciseIdx === exerciseIdx &&
              active.slotIdx === 0
            }
            onClick={() => onStartSlot(sectionIdx, exerciseIdx, 0)}
            onLongPress={() => onLongPress(sectionIdx, exerciseIdx, 0)}
          />
        )}
      </div>
    </div>
  );
}

// ---------- Tappable badge (timer/reps) ----------
function BigBadge({ label, status, active, onClick, onLongPress }) {
  const [pressing, setPressing] = useState(false);
  const pressTimerRef = useRef(null);
  const firedRef = useRef(false);

  useEffect(() => {
    return () => {
      if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    };
  }, []);

  const handlePressStart = (e) => {
    e.preventDefault();
    firedRef.current = false;
    setPressing(true);
    pressTimerRef.current = setTimeout(() => {
      firedRef.current = true;
      setPressing(false);
      if (onLongPress) onLongPress();
    }, 1500);
  };
  const handlePressEnd = () => {
    setPressing(false);
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pressTimerRef.current = null;
  };
  const handleClick = () => {
    if (firedRef.current) {
      firedRef.current = false;
      return;
    }
    if (onClick) onClick();
  };

  let bg = "transparent";
  let color = C.text;
  let border = `1.5px solid ${C.border}`;
  let content = label;

  if (active) {
    bg = C.green;
    border = `1.5px solid ${C.green}`;
    color = "#FFFFFF";
  } else if (status === "done") {
    bg = C.greenSoft;
    border = `1.5px solid ${C.green}`;
    color = C.green;
    content = <Check size={18} strokeWidth={2.8} />;
  } else if (status === "skipped") {
    bg = C.skipped;
    border = `1.5px solid ${C.skippedFaint}`;
    color = C.skippedFaint;
  }

  return (
    <button
      onClick={handleClick}
      onPointerDown={handlePressStart}
      onPointerUp={handlePressEnd}
      onPointerLeave={handlePressEnd}
      onPointerCancel={handlePressEnd}
      className="rounded-full tabular"
      style={{
        minWidth: "56px",
        height: "40px",
        background: bg,
        border,
        color,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontSize: "15px",
        fontWeight: 600,
        letterSpacing: "-0.01em",
        padding: "0 14px",
        flexShrink: 0,
        userSelect: "none",
        touchAction: "manipulation",
        transform: pressing ? "scale(1.05)" : "scale(1)",
        transition: pressing
          ? "transform 1500ms ease-out, background 200ms ease"
          : "transform 220ms cubic-bezier(0.32, 0.72, 0, 1), background 200ms ease",
      }}
    >
      {content}
    </button>
  );
}

// ---------- Timer Overlay ----------
function TimerOverlay({ active, onPause, onClose, onRepsDone, onSkipTimer }) {
  const isReps = active.mode === "reps";
  const progress =
    !isReps && active.total > 0
      ? ((active.total - active.remaining) / active.total) * 100
      : 0;

  return (
    <div
      style={{
        position: "fixed",
        bottom: 0,
        left: 0,
        right: 0,
        background: C.card,
        borderTop: `1px solid ${C.border}`,
        boxShadow: "0 -8px 32px rgba(31,29,23,0.08)",
        zIndex: 50,
        animation: "slideUp 280ms cubic-bezier(0.32, 0.72, 0, 1)",
      }}
    >
      <div style={{ height: "2px", background: C.borderSoft, overflow: "hidden" }}>
        <div
          style={{
            height: "100%",
            width: `${progress}%`,
            background: C.green,
            transition: "width 1000ms linear",
          }}
        />
      </div>

      <div className="px-6 pt-4 pb-6">
        <div className="flex items-start justify-between mb-2">
          <div style={{ flex: 1 }}>
            <div
              style={{
                fontSize: "22px",
                fontWeight: 600,
                color: C.text,
                lineHeight: 1.15,
                letterSpacing: "-0.015em",
              }}
            >
              {active.name}
              {active.side && (
                <span style={{ color: C.green, marginLeft: "8px", fontSize: "18px" }}>
                  · {active.side}
                </span>
              )}
            </div>
            {active.hint && (
              <div style={{ fontSize: "12px", color: C.textSoft, marginTop: "4px" }}>
                {active.hint}
              </div>
            )}
          </div>
          <button
            onClick={onClose}
            className="rounded-full p-1.5 -mt-1 -mr-1"
            style={{ color: C.textFaint }}
            aria-label="Close"
          >
            <X size={18} />
          </button>
        </div>

        {!isReps ? (
          <>
            <div className="flex items-center justify-between mt-4">
              <div
                className="tabular"
                style={{ fontSize: "68px", fontWeight: 300, lineHeight: 1, color: C.text }}
              >
                {formatTime(active.remaining)}
              </div>
              <button
                onClick={onPause}
                className="rounded-full flex items-center justify-center active:scale-95"
                style={{ width: "60px", height: "60px", background: C.green, color: "#FFF" }}
                aria-label={active.paused ? "Resume" : "Pause"}
              >
                {active.paused ? (
                  <Play size={24} fill="#FFF" style={{ marginLeft: 2 }} />
                ) : (
                  <Pause size={24} fill="#FFF" />
                )}
              </button>
            </div>
            <div style={{ display: "flex", justifyContent: "center", marginTop: "14px" }}>
              <button
                onClick={onSkipTimer}
                className="px-4 py-2 flex items-center gap-2 rounded-full active:scale-95"
                style={{
                  background: "transparent",
                  border: `1px solid ${C.borderSoft}`,
                  color: C.textSoft,
                  fontSize: "11px",
                  fontWeight: 500,
                  letterSpacing: "0.12em",
                  textTransform: "uppercase",
                }}
              >
                <SkipForward size={12} strokeWidth={2.2} />
                skip · mark complete
              </button>
            </div>
          </>
        ) : (
          <div className="mt-3">
            <button
              onClick={onRepsDone}
              className="w-full rounded-xl py-4 flex items-center justify-center gap-2 active:scale-[0.98]"
              style={{
                background: C.green,
                color: "#FFF",
                fontSize: "15px",
                fontWeight: 600,
              }}
            >
              <Check size={18} strokeWidth={2.5} />
              Done · {active.reps} reps complete
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Action Menu ----------
function ActionMenu({ menu, completed, onSkip, onReset, onClose }) {
  const ex = routine[menu.sectionIdx].exercises[menu.exerciseIdx];
  const k = setKey(menu.sectionIdx, menu.exerciseIdx, menu.slotIdx);
  const status = completed[k];
  const isEmpty = !status;
  const side = ex.kind === "lr" ? (menu.slotIdx === 0 ? "L" : "R") : null;

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, animation: "fadeIn 180ms ease-out" }}>
      <div
        onClick={onClose}
        style={{ position: "absolute", inset: 0, background: "rgba(31,29,23,0.4)" }}
      />
      <div
        style={{
          position: "absolute",
          bottom: 0,
          left: 0,
          right: 0,
          background: C.card,
          borderTop: `1px solid ${C.border}`,
          borderRadius: "20px 20px 0 0",
          animation: "slideUp 280ms cubic-bezier(0.32, 0.72, 0, 1)",
        }}
      >
        <div
          style={{
            width: "36px",
            height: "4px",
            background: C.border,
            borderRadius: "2px",
            margin: "10px auto 4px",
          }}
        />
        <div className="px-6 pt-3 pb-2">
          <div style={{ fontSize: "20px", fontWeight: 600, color: C.text }}>
            {ex.name}
            {side && (
              <span style={{ color: C.green, marginLeft: "8px", fontSize: "16px" }}>
                · {side}
              </span>
            )}
          </div>
          <div style={{ fontSize: "12px", color: C.textSoft, marginTop: "4px" }}>
            currently{" "}
            {status === "done" ? "marked complete" : status === "skipped" ? "marked skipped" : "not started"}
          </div>
        </div>

        <div className="px-4 pt-3 pb-3 space-y-2">
          <ActionButton
            disabled={status === "skipped"}
            icon={<SkipForward size={18} strokeWidth={2.2} />}
            label="Skip"
            sub="mark as skipped"
            onClick={onSkip}
          />
          <ActionButton
            disabled={isEmpty}
            icon={<RotateCcw size={18} strokeWidth={2.2} />}
            label="Reset"
            sub="clear this set"
            onClick={onReset}
          />
        </div>

        <div className="px-4 pb-6">
          <button
            onClick={onClose}
            className="w-full rounded-xl py-3 active:scale-[0.98]"
            style={{
              background: "transparent",
              border: `1px solid ${C.border}`,
              color: C.textSoft,
              fontSize: "14px",
              fontWeight: 500,
            }}
          >
            Cancel
          </button>
        </div>
      </div>
    </div>
  );
}

function ActionButton({ icon, label, sub, onClick, disabled }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      className="w-full rounded-xl px-4 py-3 flex items-center gap-4 active:scale-[0.98]"
      style={{
        background: C.cardSoft,
        border: `1px solid ${C.borderSoft}`,
        opacity: disabled ? 0.4 : 1,
        cursor: disabled ? "not-allowed" : "pointer",
        textAlign: "left",
      }}
    >
      <div
        className="rounded-full flex items-center justify-center flex-shrink-0"
        style={{ width: "40px", height: "40px", background: C.greenSoft, color: C.green }}
      >
        {icon}
      </div>
      <div style={{ flex: 1 }}>
        <div style={{ fontSize: "15px", fontWeight: 600, color: C.text }}>{label}</div>
        <div style={{ fontSize: "12px", color: C.textSoft, marginTop: "1px" }}>{sub}</div>
      </div>
    </button>
  );
}

// ---------- Sound Toggle ----------
function SoundToggle({ soundOn, onToggle }) {
  return (
    <button
      onClick={onToggle}
      aria-label={soundOn ? "Mute" : "Unmute"}
      style={{
        position: "absolute",
        top: "50%",
        right: "12px",
        transform: "translateY(-50%)",
        width: "28px",
        height: "28px",
        background: "transparent",
        border: "none",
        color: "#FFFFFF",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        cursor: "pointer",
      }}
    >
      <div style={{ position: "relative", display: "inline-flex" }}>
        <Volume2 size={16} strokeWidth={2} style={{ opacity: soundOn ? 1 : 0.5 }} />
        {!soundOn && (
          <X
            size={20}
            strokeWidth={2.6}
            style={{
              position: "absolute",
              top: "50%",
              left: "50%",
              transform: "translate(-50%, -50%)",
              color: "#FFFFFF",
            }}
          />
        )}
      </div>
    </button>
  );
}

// ---------- Complete Overlay ----------
function CompleteOverlay({ onTap }) {
  const onTapRef = useRef(onTap);
  onTapRef.current = onTap;

  useEffect(() => {
    const t = setTimeout(() => onTapRef.current(), 10000);
    return () => clearTimeout(t);
  }, []);

  return (
    <div
      onClick={onTap}
      style={{
        position: "fixed",
        inset: 0,
        background: C.green,
        zIndex: 100,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        cursor: "pointer",
        animation: "fadeIn 220ms ease-out",
      }}
    >
      <div
        style={{
          position: "absolute",
          top: 0,
          left: 0,
          right: 0,
          height: "2px",
          background: "rgba(255,255,255,0.15)",
          overflow: "hidden",
        }}
      >
        <div
          style={{
            height: "100%",
            width: "100%",
            background: "rgba(255,255,255,0.6)",
            animation: "progressDeplete 10s linear forwards",
          }}
        />
      </div>
      <div
        style={{
          textAlign: "center",
          color: "#FFFFFF",
          animation: "scaleIn 320ms cubic-bezier(0.32, 0.72, 0, 1)",
        }}
      >
        <Check size={64} strokeWidth={2.5} style={{ margin: "0 auto", marginBottom: "20px" }} />
        <div className="serif" style={{ fontSize: "72px", fontWeight: 500, lineHeight: 1, fontStyle: "italic" }}>
          complete
        </div>
        <div
          style={{
            fontSize: "12px",
            marginTop: "28px",
            letterSpacing: "0.25em",
            textTransform: "uppercase",
            fontWeight: 500,
            animation: "softPulse 2s ease-in-out infinite",
          }}
        >
          tap to continue
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) {
        var el = document.getElementById("err");
        if (el) {
          el.style.display = "block";
          el.textContent = "Render error: " + (error && error.message ? error.message : error) + "\n\n" + (error && error.stack ? error.stack : "") + "\n\n" + (info && info.componentStack ? info.componentStack : "");
        }
      }
      render() {
        if (this.state.error) {
          return React.createElement("div", { style: { padding: "20px", color: "#800", fontFamily: "monospace", fontSize: "13px", whiteSpace: "pre-wrap" } }, "Error: " + (this.state.error.message || String(this.state.error)));
        }
        return this.props.children;
      }
    }

    root.render(React.createElement(ErrorBoundary, null, React.createElement(App)));
  </script>
</body>
